site:
  title: SDRAM Controller
  start_page: main::index.adoc
content:
  sources:
  - url: https://github.com/oscc-ip/sdram.git
    start_paths:
    - REPLACE_ME
    branches: ng-docs
antora:
  extensions:
  - require: '@antora/lunr-extension'
ui:
  bundle:
    url: antora/ui-bundle
    snapshot: true
  supplemental_files: antora/supplemental_ui
asciidoc:
  extensions:
  - asciidoctor-kroki
  attributes:
    kroki-fetch-diagram: true
    idprefix: ''
    idseparator: '-'
